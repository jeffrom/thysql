# Runs the unit tests on macOS and Ubuntu, the end-to-end suite on Ubuntu (Docker),
# and the macOS release build (tools/package.sh) that checks the static linkage.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same ref cancels the run still in progress for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libssl-dev libzstd-dev libkrb5-dev openssl jq
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          for formula in openssl@3 zstd cmake; do
            brew list --versions "$formula" >/dev/null 2>&1 || brew install "$formula"
          done
      - name: Test (macOS)
        if: runner.os == 'macOS'
        # Pass the library dirs explicitly, so the build never picks up /opt/homebrew/lib.
        run: |
          zig build test \
            -Dopenssl-lib-dir="$(brew --prefix openssl@3)/lib" \
            -Dzstd-lib-dir="$(brew --prefix zstd)/lib"
      - name: Test (Ubuntu)
        if: runner.os == 'Linux'
        run: zig build test

  e2e-target:
    strategy:
      fail-fast: false
      matrix:
        target: [mysql, mariadb, percona]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libssl-dev libzstd-dev libkrb5-dev openssl jq
      - name: End-to-end tests (${{ matrix.target }})
        env:
          THYSQL_E2E_SERVERS: ${{ matrix.target }}
        run: zig build e2e
      - name: Upload failure diagnostics
        if: failure() && always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.target }}-diagnostics
          path: e2e-diagnostics/
          if-no-files-found: ignore

  e2e-switch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libssl-dev libzstd-dev libkrb5-dev openssl jq
      - name: Cross-server switching tests
        env:
          THYSQL_E2E_SERVERS: mysql,mariadb
        run: zig build e2e -- -k SwitchConnectionTests
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-switch-diagnostics
          path: e2e-diagnostics/
          if-no-files-found: ignore

  e2e-reporting:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Reporting unit tests
        run: python3 -m unittest discover -s tests -p 'test_e2e_*.py' -v

  static-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Install dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          for formula in openssl@3 zstd cmake; do
            brew list --versions "$formula" >/dev/null 2>&1 || brew install "$formula"
          done
      # Release build with static OpenSSL and zstd, the linkage check and the smoke tests.
      - name: Package (darwin arm64)
        run: tools/package.sh 0.0.0-ci darwin arm64
